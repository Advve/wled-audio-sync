<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <title>WLED Audio Sync - your PC's sound on every WLED light</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1236"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="380" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>

  <!-- soft glow behind the wave -->
  <ellipse cx="250" cy="180" rx="230" ry="170" fill="url(#glow)"/>

  <!-- the app icon: a sound wave of five rounded bars (same proportions as the tray icon) -->
  <g fill="url(#wave)">
    <rect x="120" y="135" width="36" height="90"  rx="18"/>
    <rect x="176" y="95"  width="36" height="170" rx="18"/>
    <rect x="232" y="62"  width="36" height="236" rx="18"/>
    <rect x="288" y="107" width="36" height="146" rx="18"/>
    <rect x="344" y="145" width="36" height="70"  rx="18"/>
  </g>

  <text x="460" y="168" fill="#f5f5f7" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-1">WLED Audio Sync</text>
  <text x="462" y="222" fill="#aeb4cc" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="30">Your PC's sound, on every WLED light.</text>

  <!-- a row of "LEDs" picking up the wave colours -->
  <g>
    <circle cx="474"  cy="276" r="7" fill="#22d3ee"/>
    <circle cx="502"  cy="276" r="7" fill="#38bdf8"/>
    <circle cx="530"  cy="276" r="7" fill="#60a5fa"/>
    <circle cx="558"  cy="276" r="7" fill="#818cf8"/>
    <circle cx="586"  cy="276" r="7" fill="#a855f7"/>
    <circle cx="614"  cy="276" r="7" fill="#c04ee0"/>
    <circle cx="642"  cy="276" r="7" fill="#d946c4"/>
    <circle cx="670"  cy="276" r="7" fill="#e5469f"/>
    <circle cx="698"  cy="276" r="7" fill="#ec4899"/>
    <circle cx="726"  cy="276" r="7" fill="#ec4899" opacity="0.55"/>
    <circle cx="754"  cy="276" r="7" fill="#ec4899" opacity="0.3"/>
    <circle cx="782"  cy="276" r="7" fill="#ec4899" opacity="0.15"/>
  </g>
</svg>
